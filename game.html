.kruit-shop h1,.kruit-shop h3,.kruit-shop p{margin:0}
.kruit-shop button,.kruit-shop input,.kruit-shop select{font:inherit;color:inherit}

.ks-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ks-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.ks-brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}

.ks-close:hover,.ks-link:hover{background:var(--card)}
.ks-link{border:none;text-decoration:underline;color:var(--spark);padding:8px 4px;font-size:14px}
.ks-wallet{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line)}

    <script>
/* Included: shop-core.js */
(function (root) {
    'use strict';
    const catalog = root.BomShopCatalog;
    const uniqueOwned = (values, kind) => [...new Set([
        ...catalog.items.filter(i => i.kind === kind && i.price === 0).map(i => i.id),
        ...(Array.isArray(values) ? values : []).filter(id => catalog.get(id)?.kind === kind),
    ])];
    function normalize(raw = {}) {
        const profile = { ...raw, munten: Math.max(0, Math.floor(Number(raw.munten) || 0)), inventory: {} };
        for (const item of catalog.items.filter(i => i.kind === 'consumable')) {
            profile.inventory[item.id] = Math.min(99, Math.max(0, Math.floor(Number(raw.inventory?.[item.id]) || 0)));
        }
        profile.ownedAvatars = uniqueOwned(raw.ownedAvatars, 'avatar');
        profile.ownedSkins = uniqueOwned(raw.ownedSkins, 'skin');
        profile.selectedAvatarId = profile.ownedAvatars.includes(raw.selectedAvatarId) ? raw.selectedAvatarId : 'avatar-cadet';
        profile.selectedSkinId = profile.ownedSkins.includes(raw.selectedSkinId) ? raw.selectedSkinId : 'skin-classic';
        return profile;
    }
    function purchase(raw, id) {
        const p = normalize(raw), item = catalog.get(id);
        if (!item) throw new Error('Dit artikel bestaat niet.');
        if (item.kind !== 'consumable' && (item.kind === 'avatar' ? p.ownedAvatars : p.ownedSkins).includes(id)) {
            throw new Error('Je bezit dit artikel al. Je kunt het gratis kiezen.');
        }
        if (p.munten < item.price) throw new Error('Niet genoeg Kruit-Munten voor dit artikel.');
        if (item.kind === 'consumable' && p.inventory[id] >= 99) throw new Error('Je hebt al 99 van dit artikel.');
        p.munten -= item.price;
        if (item.kind === 'consumable') p.inventory[id]++;
        else if (item.kind === 'avatar') { p.ownedAvatars.push(id); p.selectedAvatarId = id; }
        else { p.ownedSkins.push(id); p.selectedSkinId = id; }
        return p;
    }
    function equip(raw, id) {
        const p = normalize(raw), item = catalog.get(id);
        if (!item || item.kind === 'consumable') throw new Error('Dit artikel kun je niet als uiterlijk kiezen.');
        if (!(item.kind === 'avatar' ? p.ownedAvatars : p.ownedSkins).includes(id)) throw new Error('Koop dit uiterlijk eerst.');
        if (item.kind === 'avatar') p.selectedAvatarId = id; else p.selectedSkinId = id;
        return p;
    }
    function consume(raw, id) {
        const p = normalize(raw);
        if (catalog.get(id)?.kind !== 'consumable' || p.inventory[id] < 1) throw new Error('Dit item zit niet in je inventaris.');
        p.inventory[id]--;

            const grid = panel.querySelector('#antwoordOptiesContainer');
            if (!grid) return;

            const { size, headroom } = mobileMetrics(bounds.width, parseFloat(gridStyle.columnGap) || 0);
            grid.querySelectorAll('.antwoord-knop').forEach(button => {
                button.style.setProperty('width', `${size}px`, 'important');
                button.style.setProperty('height', `${size}px`, 'important');
                button.style.setProperty('margin-top', `${headroom}px`, 'important');
                button.style.setProperty('font-size', `${Math.max(12, Math.min(16, size * .105))}px`, 'important');

        const padding = getComputedStyle(document.body);

                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(700, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.08);

                players[existing].munten = Math.max(0, Number(player.munten) || 0);
                players[existing].spaarpunten = Math.max(0, Number(player.spaarpunten ?? players[existing].spaarpunten) || 0);
                players[existing].paidCoins = Math.max(0, Number(player.paidCoins ?? players[existing].paidCoins) || 0);
                players[existing].punten = Math.max(0, Number(player.punten ?? players[existing].punten) || 0);
                players[existing].paymentMode = player.paymentMode ?? players[existing].paymentMode;
                for (const key of ['inventory', 'ownedAvatars', 'ownedSkins', 'selectedAvatarId', 'selectedSkinId']) {
                    if (player[key] !== undefined) players[existing][key] = player[key];
                }
                player.profileId = players[existing].id;

        function willekeurigGetal(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function maakRekenBomVraag() {
            const kids = gameState.leeftijdscategorie === 'kids';
            const max = kids ? 12 : 35;
            const type = willekeurigGetal(0, 3);
            let a, b, antwoord, teken;
            if (type === 0) {
                a = willekeurigGetal(1, max); b = willekeurigGetal(1, max);
                antwoord = a + b; teken = '+';
            } else if (type === 1) {
                a = willekeurigGetal(1, max); b = willekeurigGetal(1, a);
                antwoord = a - b; teken = '−';
            } else if (type === 2) {
                a = willekeurigGetal(2, kids ? 10 : 15); b = willekeurigGetal(2, kids ? 10 : 15);
                antwoord = a * b; teken = '×';
            } else {
                b = willekeurigGetal(2, 12); antwoord = willekeurigGetal(2, kids ? 10 : 20);
                a = b * antwoord; teken = '÷';
            }
            const opties = [String(antwoord)];
            for (const offset of [1, -1, 2, -2, 3, -3, 5, -5, 7, -7, 10, -10]) {
                const kandidaat = String(antwoord + offset);
                if (!opties.includes(kandidaat)) opties.push(kandidaat);
                if (opties.length === 4) break;
            }
            const geschud = BomQuestionFlow.shuffle(opties);
            return {
                titel: type === 3 ? '➗ REKEN-BOM' : '🔢 REKEN-BOM',
                type: 'mc',
                tekst: `Hoeveel is **${a} ${teken} ${b}**?`,
                opties: geschud,
                correct: String(antwoord),
                antwoord: `Juiste antwoord: ${antwoord}`
            };
        }

        function maakEindelozeVraag() {
            if (Math.random() < 0.65 || !Object.keys(categoriePools).length) {
                return { ...maakRekenBomVraag(), titel: '♾️ EINDELOZE CHAOS' };
            }
            const pool = Object.values(categoriePools).flat().filter(item => !BomQuestionFlow.has(item.v));
            if (!pool.length) return maakRekenBomVraag();
            const item = pool[willekeurigGetal(0, pool.length - 1)];
            return {
                titel: '♾️ CHAOS-MIX',
                type: 'mc',
                tekst: item.v,
                opties: [...item.opties].sort(() => Math.random() - 0.5),
                correct: item.antwoord,
                antwoord: `Juiste antwoord: "${item.antwoord}"`
            };
        }

        function genereerChaosOpdracht() {
            if (BomQuestionFlow.storageError) return { type: 'content-empty' };
            let gekozenCat = gameState.geselecteerdeCategorie;
            if (!gebruikteVragen[gekozenCat]) gebruikteVragen[gekozenCat] = [];

            if (gekozenCat === 'eindeloos') return BomQuestionFlow.generated(maakEindelozeVraag);
            if (gekozenCat === 'reken') {
                return BomQuestionFlow.generated(maakRekenBomVraag);
            }
            else if (categoriePools[gekozenCat]) {
                const pool = categoriePools[gekozenCat];
                const item = BomQuestionFlow.choosePool(gekozenCat, pool);
                if (item.exhausted) return { type: 'content-empty' };
                const opties = BomQuestionFlow.shuffle(item.opties);
                let catTitles = { algemeen: "🧠 ALGEMENE KENNIS", geschiedenis: "📜 GESCHIEDENIS", muziek: "🎵 MUZIEK", aardrijkskunde: "🌍 AARDRIJKSKUNDE", sport: "⚽ SPORT", tv: "📺 TV & SERIES" };
                return { titel: catTitles[gekozenCat] || "🧠 KENNIS", type: 'mc', tekst: `${item.v}`, opties: opties, correct: item.antwoord, antwoord: `Juiste antwoord: "${item.antwoord}"` };

                const item = BomQuestionFlow.choosePool(`${gekozenCat}:${gameState.taalNiveau}`, bronVragen);

            }
            else {
                return { titel: "🔢 REKEN-BOM", type: 'mc', tekst: "Hoeveel is **5 + 5**?", opties: ["8", "10", "12", "15"], correct: "10", antwoord: "Juiste antwoord: 10" };

        }

            let snapshot;
            try {
                snapshot = JSON.parse(JSON.stringify({
                    ...gameState,
                    timerInterval: null,
                    players,
                    winnaarSpeler: winner
                }));
            } catch (error) {
                console.error('Spelstatus kan niet naar andere spelers worden gestuurd.', error);
                return;
            }
            const message = { type: 'SYNC_STATE', gameState: snapshot };
            connections = connections.filter((connection) => connection && connection.open !== false);
            connections.forEach((connection) => {
                try {
                    connection.send(message);
                } catch (error) {
                    connections = connections.filter((item) => item !== connection);
                    console.error('Verbinding met een speler is verbroken.', error);
                }
            });
        }

        function getAnswerBombFuseVisual(timer, maxTimer) {
            const current = Number(timer);
            const fraction = Number.isFinite(current) && maxTimer > 0
                ? Math.max(0, Math.min(1, current / maxTimer))
                : 1;
            const points = [
                { x: 222, y: 24 },
                { x: 214, y: 52 },
                { x: 197, y: 57 },
                { x: 188, y: 86 }
            ];
            const pointAt = t => {
                const inverse = 1 - t;
                return {
                    x: inverse ** 3 * points[0].x + 3 * inverse ** 2 * t * points[1].x + 3 * inverse * t ** 2 * points[2].x + t ** 3 * points[3].x,
                    y: inverse ** 3 * points[0].y + 3 * inverse ** 2 * t * points[1].y + 3 * inverse * t ** 2 * points[2].y + t ** 3 * points[3].y
                };
            };
            // SVG dashes use arc length, not the Bezier parameter. Match that
            // distance so the flame stays on the end of the shortening rope.
            const samples = [{ ...points[0], distance: 0 }];
            for (let i = 1; i <= 64; i++) {
                const point = pointAt(i / 64), previous = samples[i - 1];
                samples.push({ ...point, distance: previous.distance + Math.hypot(point.x - previous.x, point.y - previous.y) });
            }
            const wanted = samples[64].distance * (1 - fraction);
            const index = Math.max(1, samples.findIndex(point => point.distance >= wanted));
            const start = samples[index - 1], end = samples[index];
            const part = (wanted - start.distance) / (end.distance - start.distance);
            return { fraction, x: start.x + (end.x - start.x) * part, y: start.y + (end.y - start.y) * part };
        }

        function syncPhoneBuzzerState() {
            if (!buzzerHostPeer) return;
            const playersByName = new Map(gameState.players.map(player => [player.naam, player]));
            const ranking = [...gameState.players].sort((a, b) => (b.goedeVragen || 0) - (a.goedeVragen || 0) || (b.punten || 0) - (a.punten || 0));
            const ranks = new Map(ranking.map((player, index) => [player, index + 1]));
            const canBuzz = gameState.screen === 'play' && !firstBuzzer && !isQuestionAnswered;
            const baseState = {
                type: 'BUZZER_STATE',
                roundId: getBuzzerRoundId(),
                connected: true,
                canBuzz,
                winner: firstBuzzer ? firstBuzzer.naam : '',
                winnerPeer: firstBuzzer ? firstBuzzer.peer : '',

                explosionEvent: gameState.screen === 'exploding' ? gameState.explosionEvent : null,

                    ? `${firstBuzzer.naam} was als eerste.`
                    : canBuzz ? 'De vraag staat klaar. Druk op BUZZ!' : 'Wacht tot de volgende vraag.'
            };
            buzzerConnections.forEach((entry) => {
                if (entry.name && entry.connection && entry.connection.open) {
                    const isWinner = Boolean(
                        firstBuzzer &&
                        firstBuzzer.peer === entry.connection.peer &&
                        !firstBuzzer.answered &&
                        !isQuestionAnswered &&
                        gameState.screen === 'play'
                    );
                    entry.connection.send({
                        ...baseState,
                        canAnswer: isWinner,
                        question: isWinner && gameState.huidigeOpdracht ? gameState.huidigeOpdracht.tekst : '',
                        options: isWinner && gameState.huidigeOpdracht ? gameState.huidigeOpdracht.opties.filter(answer => !(gameState.hiddenAnswers || []).includes(answer)) : [],

                        }
                    });
                }
            });
        }

        function startPhoneBuzzerHost() {
            if (buzzerHostPeer) {
                refreshPhoneBuzzerPanels();
                return;
            }
            buzzerLastError = '';
            refreshPhoneBuzzerPanels();
            if (typeof Peer === 'undefined') {
                buzzerLastError = 'De verbindingsdienst is niet geladen. Controleer je internetverbinding en probeer opnieuw.';
                refreshPhoneBuzzerPanels();
                return;
            }
            try {
                buzzerHostPeer = new Peer();
                buzzerHostPeer.on('open', (id) => {
                    buzzerHostId = id;
                    refreshPhoneBuzzerPanels();
                    syncPhoneBuzzerState();
                });
                buzzerHostPeer.on('connection', (connection) => {
                    const entry = { connection, name: '', playerIndex: -1 };
                    buzzerConnections.set(connection.peer, entry);
                    connection.on('data', (data) => handlePhoneBuzzerHostData(data, connection));
                    const dropConnection = () => {
                        if (buzzerConnections.get(connection.peer)?.connection !== connection) return;
                        buzzerConnections.delete(connection.peer);
                        if (firstBuzzer?.peer === connection.peer && !isQuestionAnswered && gameState.screen === 'play') {
                            firstBuzzer = null;
                            gameState.awaitingBuzzerEffects = true;
                            render();
                        }
                        syncPhoneBuzzerState();
                        refreshPhoneBuzzerPanels();
                    };
                    connection.on('close', dropConnection);
                    connection.on('error', dropConnection);
                });
                buzzerHostPeer.on('error', (error) => {
                    buzzerLastError = error.type === 'unavailable-id'
                        ? 'De verbindingscode is al in gebruik. Probeer opnieuw.'
                        : 'Er kon geen verbinding worden gemaakt. Controleer internet en probeer opnieuw.';
                    buzzerHostPeer = null;
                    buzzerHostId = '';
                    refreshPhoneBuzzerPanels();
                });
            } catch (error) {
                buzzerHostPeer = null;
                buzzerLastError = 'De telefoonbuzzer kon niet worden gestart. Probeer opnieuw.';
                refreshPhoneBuzzerPanels();
            }
        }

        function findOrCreateBuzzerPlayer(name, companionProfileId) {
            const normalizedName = name.toLocaleLowerCase();
            let playerIndex = gameState.players.findIndex((player) => companionProfileId
                ? player.companionProfileId === companionProfileId
                : String(player.naam).toLocaleLowerCase() === normalizedName);
            if (playerIndex >= 0) return playerIndex;
            gameState.players.push({ ...createShopGamePlayer(name), companionProfileId });
            return gameState.players.length - 1;
        }

        function handlePhoneBuzzerHostData(data, connection) {
            const entry = buzzerConnections.get(connection.peer);
            if (!entry || !data || typeof data !== 'object') return;
            if (data.type === 'BUZZ' || data.type === 'BUZZER_ANSWER') {
                if (!data.roundId) {
                    connection.send({ type:'BUZZER_STATE', connected:true, canBuzz:false, canAnswer:false,
                        status:'Ververs je telefoonpagina om met deze versie te spelen.' });
                    return;
                }
                if (data.roundId !== getBuzzerRoundId()) { syncPhoneBuzzerState(); return; }
            }
            if (data.type === 'BUZZER_JOIN') {
                const desiredName = sanitizeBuzzerName(data.naam);
                let name = entry.name || desiredName;
                if (!name) {
                    connection.send({ type: 'BUZZER_STATE', connected: false, status: 'Vul eerst je naam in.' });
                    return;
                }
                const occupied = new Set([...buzzerConnections.values()].filter(other => other !== entry && other.name).map(other => other.name.toLowerCase()));
                for (let suffix = 2; occupied.has(name.toLowerCase()); suffix++) {
                    const ending = ` (${suffix})`;
                    name = desiredName.slice(0, 24 - ending.length) + ending;
                }
                entry.name = name;
                buzzerConnections.set(connection.peer, entry);
                findOrCreateBuzzerPlayer(name);
                connection.send({ type: 'BUZZER_NAME', name });
                refreshPhoneBuzzerPanels();
                if (!handlePhoneBuzzerHostData.syncQueued) {
                    handlePhoneBuzzerHostData.syncQueued = true;
                    requestAnimationFrame(() => {
                        handlePhoneBuzzerHostData.syncQueued = false;
                        syncPhoneBuzzerState();
                    });
                }
                return;
            }
            if (data.type === 'BUZZER_ANSWER') {
                if (
                    gameState.screen !== 'play' ||
                    !firstBuzzer ||
                    firstBuzzer.peer !== connection.peer ||
                    firstBuzzer.answered ||
                    isQuestionAnswered ||
                    !gameState.huidigeOpdracht ||
                    !gameState.huidigeOpdracht.opties.includes(data.antwoord) ||
                    (gameState.hiddenAnswers || []).includes(data.antwoord)
                ) return;
                firstBuzzer.answered = true;
                connection.send({
                    type: 'BUZZER_RESULT',
                    correct: data.antwoord === gameState.huidigeOpdracht.correct
                });
                beantwoordVraag(data.antwoord);
                return;
            }
            if (data.type !== 'BUZZ' || !entry.name) return;
            if (gameState.screen !== 'play' || firstBuzzer || isQuestionAnswered) {
                syncPhoneBuzzerState();
                return;
            }
            const playerIndex = findOrCreateBuzzerPlayer(entry.name, entry.companionProfileId);
            firstBuzzer = { naam: entry.name, peer: connection.peer, answered: false };
            gameState.currentPlayerIndex = playerIndex;
            if (gameState.awaitingBuzzerEffects) {
                const elapsed = Math.max(0, gameState.maxTimer - gameState.timer);
                BomShopCore.prepareTurn(gameState);
                gameState.timer = Math.max(1, gameState.maxTimer - elapsed);
                gameState.awaitingBuzzerEffects = false;
            }
            if (gameState.isOnline && isHost) broadcastState();
            render();
        }

        function connectPhoneBuzzer() {
            if (buzzerControllerState.connecting) return;
            const input = document.getElementById('phoneBuzzerName');
            const name = sanitizeBuzzerName(input ? input.value : '');
            if (!name) {
                buzzerControllerState.status = 'Vul eerst je naam in.';
                renderPhoneBuzzerController();
                return;
            }
            buzzerControllerName = name;
            try { localStorage.setItem('bom_chaos_buzzer_name', name); } catch (error) {}
            if (typeof Peer === 'undefined') {
                buzzerControllerState.status = 'De verbindingsdienst is niet geladen. Controleer je internetverbinding.';
                renderPhoneBuzzerController();
                return;
            }
            buzzerControllerState.status = 'Verbinden met de tv…';
            if (buzzerControllerPeer?.destroy) buzzerControllerPeer.destroy();
            buzzerControllerState.connecting = true;
            renderPhoneBuzzerController();
            const peer = buzzerControllerPeer = new Peer();
            peer.on('open', (id) => {
                if (buzzerControllerPeer !== peer) return;
                buzzerControllerState.controllerId = id;
                buzzerControllerConnection = buzzerControllerPeer.connect(buzzerControllerHostId, { reliable: true });
                buzzerControllerConnection.on('open', () => {
                    buzzerControllerState.connecting = false;
                    buzzerControllerState.connected = true;
                    buzzerControllerState.status = 'Verbonden met de tv.';
                    buzzerControllerConnection.send({ type: 'BUZZER_JOIN', naam: buzzerControllerName });
                    renderPhoneBuzzerController();
                });
                buzzerControllerConnection.on('data', (data) => {
                    if (!data) return;
                    if (data.type === 'BUZZER_NAME') {
                        buzzerControllerName = sanitizeBuzzerName(data.name);
                        try { localStorage.setItem('bom_chaos_buzzer_name', buzzerControllerName); } catch (error) {}
                        renderPhoneBuzzerController();
                        return;
                    }
                    if (data.type === 'BUZZER_RESULT') {
                        buzzerControllerState.answerSubmitted = true;
                        buzzerControllerState.canAnswer = false;
                        buzzerControllerState.result = data.correct ? 'Goed antwoord! Je krijgt punten.' : 'Dat antwoord was niet goed.';
                        buzzerControllerState.status = buzzerControllerState.result;
                        renderPhoneBuzzerController();
                        return;
                    }
                    if (data.type !== 'BUZZER_STATE') return;
                    const winnerPeer = data.winnerPeer || '';
                    if (winnerPeer !== buzzerControllerState.winnerPeer || data.roundId !== buzzerControllerState.roundId) {
                        buzzerControllerState.answerSubmitted = false;
                        buzzerControllerState.result = '';
                    }
                    buzzerControllerState.connected = data.connected !== false;
                    buzzerControllerState.roundId = data.roundId || '';
                    buzzerControllerState.canBuzz = Boolean(data.canBuzz);
                    buzzerControllerState.canAnswer = Boolean(data.canAnswer);
                    buzzerControllerState.winner = data.winner || '';
                    buzzerControllerState.winnerPeer = winnerPeer;
                    buzzerControllerState.question = data.question || '';
                    buzzerControllerState.options = Array.isArray(data.options) ? data.options : [];
                    buzzerControllerState.smokeActive = Boolean(data.smokeActive);
                    buzzerControllerState.screen = data.screen;
                    buzzerControllerState.explosionEvent = data.explosionEvent || null;
                    buzzerControllerState.timer = data.timer;
                    buzzerControllerState.maxTimer = data.maxTimer;
                    buzzerControllerState.skinId = data.skinId || 'skin-classic';
                    buzzerControllerState.ownScore = data.ownScore || null;
                    buzzerControllerState.status = data.status || 'Verbonden met de tv.';
                    renderPhoneBuzzerController();
                });
                buzzerControllerConnection.on('close', () => {
                    if (buzzerControllerPeer !== peer) return;
                    buzzerControllerState.connecting = false;
                    buzzerControllerState.connected = false;
                    buzzerControllerState.canBuzz = false;
                    buzzerControllerState.status = 'Verbinding met de tv verbroken. Scan de QR-code opnieuw.';
                    renderPhoneBuzzerController();
                });
            });
            buzzerControllerPeer.on('error', () => {
                if (buzzerControllerPeer !== peer) return;
                buzzerControllerState.connecting = false;
                buzzerControllerState.connected = false;
                buzzerControllerState.status = 'Verbinden is niet gelukt. Controleer of het tv-spel nog openstaat.';
                renderPhoneBuzzerController();
            });
        }

                !buzzerControllerConnection.open ||

        function zichtbareScoreSpelers() {
            const all = gameState.players.map((player, index) => ({ player, index }));
            if (all.length <= 8) return all.map((entry, index) => ({ ...entry, rank: index + 1 }));
            const ranked = all.sort((a, b) => (b.player.goedeVragen || 0) - (a.player.goedeVragen || 0) || (b.player.punten || 0) - (a.player.punten || 0));
            ranked.forEach((entry, index) => { entry.rank = index + 1; });
            const visible = ranked.slice(0, 5), active = ranked.find(entry => entry.index === gameState.currentPlayerIndex);
            if (active && !visible.includes(active)) visible.push(active);
            return visible;
        }

                speler.munten -= kosten;
                updateShopPlayerBalance(speler);
                if (itemType === 'tijd') {
                    gameState.timer += 5;
                    alert("⏱️ +5 seconden toegevoegd!");
                } else if (itemType === 'schild') {
                    speler.heeftSchild = true;
                    alert("🛡️ Schild geactiveerd!");
                } else if (itemType === 'mijnenveger') {
                    speler.heeftMijnenveger = true;
                    alert("🕵️‍♂️ Mijnenveger geactiveerd! 1 fout antwoord wordt direct opgeruimd.");
                    activeerMijnenveger();
                    sluitShop();
                    return;
                } else if (itemType === 'sabotage') {
                    let volgendeIdx = (gameState.currentPlayerIndex + 1) % gameState.players.length;
                    gameState.players[volgendeIdx].sabotageTimer = true;
                    alert("🧨 Dynamiet geplaatst bij " + gameState.players[volgendeIdx].naam + "! Zijn timer telt dubbel zo snel.");
                } else if (itemType === 'rook') {
                    gameState.aktiefRookgordijn = true;
                    alert("🌪️ Rookgordijn geworpen! Het scherm is 3 seconden wazig.");
                }
                if (gameState.isOnline && isHost) broadcastState();
                openShop();
            } else {
                alert("Niet genoeg Kruit-Munten!");
            }
        }

        function activeerMijnenveger() {
            let speler = gameState.players[gameState.currentPlayerIndex];
            if (speler.heeftMijnenveger) {
                speler.heeftMijnenveger = false;
                let juisteAntwoord = gameState.huidigeOpdracht.correct;
                let knoppen = document.querySelectorAll('.antwoord-knop');
                let foutKnoppen = Array.from(knoppen).filter(k => k.innerText.trim() !== juisteAntwoord);
                if (foutKnoppen.length > 0) {
                    let wegKnoppen = foutKnoppen[Math.floor(Math.random() * foutKnoppen.length)];
                    wegKnoppen.style.opacity = '0.1';
                    wegKnoppen.style.pointerEvents = 'none';
                    wegKnoppen.disabled = true;
                    const label = wegKnoppen.querySelector('.antwoord-label');
                    if (label) label.textContent = 'Uitgeschakeld';
                }
            }
        }

        function voegPuntenToeEnCheckWinst(speler) {
            speler.streak = (Number(speler.streak) || 0) + 1;
            speler.goedeVragen = (Number(speler.goedeVragen) || 0) + 1;
            gameState.totaalVragenGoed = (Number(gameState.totaalVragenGoed) || 0) + 1;
            speler.punten = (Number(speler.punten) || 0) + 1;
            slaHighscoreOp(speler.naam, speler.punten, speler.avatar);
            const profile = shopPlayerByName(speler.naam);
            profile.spaarpunten = (Number(profile.spaarpunten) || 0) + 1;
            if (profile.spaarpunten >= 1000) {
                profile.spaarpunten -= 1000;
                profile.munten += 1;
                speler.munten = profile.munten;
                try { confetti({ particleCount: 100, spread: 70, origin: { y: 0.4 } }); } catch(e) {}
            }
            speler.spaarpunten = profile.spaarpunten;
            speler.paidCoins = profile.paidCoins;
            profile.punten = speler.punten;
            updateShopPlayerBalance(profile);

            if (speler.goedeVragen >= 100) {
                clearInterval(gameState.timerInterval);
                if(autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
                gameState.winnaarSpeler = speler;
                speler.isBomKoning = true;
                gameState.screen = 'winnaar';
                try { confetti({ particleCount: 500, spread: 360, origin: { y: 0.4 } }); } catch(e) {}
                render();
                return;
            }

            volgendeBeurt();
        }

        function beantwoordVraag(geselecteerd) {
            initAudio();
            if (gameState.screen !== 'play' || (gameState.hiddenAnswers || []).includes(geselecteerd)) return;
            if (gameState.isOnline && !isHost) {
                conn.send({ type: 'ANSWER', antwoord: geselecteerd });
                return;
            }
            if (isQuestionAnswered) return;
            isQuestionAnswered = true;

            let speler = gameState.players[gameState.currentPlayerIndex];
            if (geselecteerd === gameState.huidigeOpdracht.correct) {
                voegPuntenToeEnCheckWinst(speler, 250);
            } else {
                speler.streak = 0;
                triggerExplosionEffect(geselecteerd);
            }
            if (gameState.isOnline && isHost) broadcastState();
        }

        function volgendeBeurt() {
            if (gameState.screen === 'winnaar') return;
            clearInterval(gameState.timerInterval);
            if(autoAdvanceTimer) clearTimeout(autoAdvanceTimer);

            firstBuzzer = null;
            isQuestionAnswered = false;
            if (gameState.players.length > 1) {
                gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
            }
            gameState.aktiefRookgordijn = false;
            gameState.huidigeOpdracht = genereerChaosOpdracht();
            gameState.screen = 'play';
            startTimer();
            if (gameState.isOnline && isHost) broadcastState();
            render();

        }

        function triggerExplosionEffect(geselecteerd) {
            if (gameState.screen !== 'play') return;
            clearInterval(gameState.timerInterval);
            const player = gameState.players[gameState.currentPlayerIndex];
            if (player && BomShopCore.absorbShield(player)) {
                gameState.lastShopEvent = `${player.naam} is gered door een bomschild.`;
                volgendeBeurt();
                return;
            }
            gameState.huidigeStraf = geefUniekeStraf();

            const event = {
                id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
                x: .5,
                y: .5
            };
            gameState.explosionEvent = event;
            gameState.screen = 'exploding';
            isQuestionAnswered = true;
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                try { navigator.vibrate([100, 50, 180]); } catch(e) {}
            }
            render();
            if (gameState.isOnline && isHost) broadcastState();
            const finishExplosion = () => {
                if (gameState.screen !== 'exploding' || gameState.explosionEvent?.id !== event.id) return;
                gameState.screen = 'boom';
                if (gameState.isOnline && isHost) broadcastState();
                render();
            };
            if (BomExplosionEffects.finished && typeof BomExplosionEffects.finished.then === 'function') {
                BomExplosionEffects.finished.then(finishExplosion);
            } else autoAdvanceTimer = setTimeout(finishExplosion, BomExplosionEffects.durationMs);
        }

        function startTimer(resetTimer = true) {
            clearInterval(gameState.timerInterval);
            if(autoAdvanceTimer) clearTimeout(autoAdvanceTimer);

            if (gameState.huidigeOpdracht?.type === 'content-empty') {
                gameState.screen = 'content_empty';
                isQuestionAnswered = false;
                return;
            }

            if (resetTimer || !Number.isFinite(Number(gameState.timer))) {
                gameState.awaitingBuzzerEffects = [...buzzerConnections.values()].some(entry => entry.name);
                BomShopCore.prepareTurn(gameState, gameState.awaitingBuzzerEffects);
            }
            gameState.timerInterval = setInterval(() => {
                if (gameState.isOnline && !isHost) return;

                if (gameState.smokeTicks > 0) {
                    gameState.smokeTicks--;
                    gameState.aktiefRookgordijn = gameState.smokeTicks > 0;
                    if (!gameState.aktiefRookgordijn) document.getElementById('antwoordOptiesContainer')?.classList.remove('blur-effect');
                }
                if (gameState.freezeTicks > 0) gameState.freezeTicks--;
                else {
                    gameState.timer -= gameState.activeTickMultiplier || 1;
                    playTickSound();
                }

                const fuseVisual = getAnswerBombFuseVisual(gameState.timer, gameState.maxTimer);
                document.querySelectorAll('.antwoord-knop').forEach((button) => {
                    button.style.setProperty('--flame-x', `${(fuseVisual.x / 240 * 100).toFixed(1)}%`);
                    button.style.setProperty('--flame-y', `${(fuseVisual.y / 240 * 100).toFixed(1)}%`);
                    const hotFuse = button.querySelector('.bomb-fuse-hot');
                    if (hotFuse) hotFuse.style.strokeDasharray = `${(fuseVisual.fraction * 100).toFixed(1)} 100`;
                    const remainingFuse = button.querySelector('.bomb-fuse-remaining');
                    if (remainingFuse) remainingFuse.setAttribute('stroke-dasharray', `${(fuseVisual.fraction * 100).toFixed(1)} 100`);
                    const flame = button.querySelector('.antwoord-vlam');
                    if (flame) {
                        flame.style.left = `${(fuseVisual.x / 240 * 100).toFixed(1)}%`;
                        flame.style.top = `${(fuseVisual.y / 240 * 100).toFixed(1)}%`;
                    }
                });
                
                const td = document.getElementById('timerDisplay');
                if(td) td.innerText = gameState.freezeTicks > 0 ? `❄ ${gameState.freezeTicks}s · ${Math.max(0, gameState.timer)}s` : `💣 ${Math.max(0, gameState.timer)}s`;

                const lont = document.getElementById('lontBar');
                if(lont) lont.style.width = `${(Math.max(0, gameState.timer) / gameState.maxTimer) * 100}%`;
                
                if(gameState.timer <= 0) {
                    clearInterval(gameState.timerInterval);
                    triggerExplosionEffect();
                }
                if (gameState.isOnline && isHost) broadcastState();
                syncPhoneBuzzerState();
            }, 1000);
        }

        function herstartRonde() {
            document.body.classList.remove('animate-shake');
            if(autoAdvanceTimer) clearTimeout(autoAdvanceTimer);

            firstBuzzer = null;
            isQuestionAnswered = false;
            gameState.currentPlayerIndex = gameState.players.length > 1 ? Math.floor(Math.random() * gameState.players.length) : 0;
            gameState.aktiefRookgordijn = false;
            gameState.huidigeOpdracht = genereerChaosOpdracht();
            gameState.screen == 'play' ? gameState.screen = 'play' : gameState.screen = 'play';
            startTimer();
            if (gameState.isOnline && isHost) broadcastState();
            render();
        }

    </script>

    <script>
      // Simple directional focus for television remotes; native Tab/Enter remain available.
      const makeGameControlsFocusable = () => {
        document.querySelectorAll('#app [onclick]').forEach((el) => {
          if (!el.matches('button, input, select, a, textarea')) el.setAttribute('tabindex', '0');
        });
      };
      new MutationObserver(makeGameControlsFocusable).observe(document.getElementById('app'), { childList: true, subtree: true });
      makeGameControlsFocusable();
      document.addEventListener('keydown', (event) => {
        if ((event.key === 'Enter' || event.key === ' ') && document.activeElement?.matches('#app [onclick]:not(button)')) {
          event.preventDefault();
          document.activeElement.click();
          return;
        }
        if (!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)) return;
        const active = document.activeElement;
        if (active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return;
        const controls = [...document.querySelectorAll('#app button:not(:disabled), #app select, #app input, #app [onclick]')]
          .filter((el) => !el.matches(':disabled,[aria-disabled="true"]') && el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');
        if (!controls.length) return;
        const current = controls.indexOf(active);
        if (current < 0) { controls[0].focus(); event.preventDefault(); return; }
        const direction = {ArrowRight:[1,0], ArrowLeft:[-1,0], ArrowDown:[0,1], ArrowUp:[0,-1]}[event.key];
        const from = controls[current].getBoundingClientRect();
        const cx = from.left + from.width/2, cy = from.top + from.height/2;
        let best = null, bestScore = Infinity;
        controls.forEach((el, index) => {
          if (index === current) return;
          const r = el.getBoundingClientRect(), dx = r.left+r.width/2-cx, dy = r.top+r.height/2-cy;
          const forward = dx*direction[0] + dy*direction[1];
          if (forward <= 2) return;
          const cross = Math.abs(dx*direction[1] - dy*direction[0]);
          const score = forward + cross*2.2;
          if (score < bestScore) { bestScore=score; best=el; }
        });
        if (best) { event.preventDefault(); best.focus(); }
      });
    </script>

    <script>
/* Included: companion-host.js */
/* Native companion bridge. The existing TV game remains the question/score authority. */
let mobileRoom = null;
let mobileTimer = null;
let mobileAck = 0;
let mobileBusy = false;
let mobileError = '';
let mobileStarting = false;
function mobileRoundId() {
    return getBuzzerRoundId();
}

async function mobileRequest(path, body) {
    const response = await fetch('/api/companion/' + path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body), signal: AbortSignal.timeout(8000)
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'De mobiele verbinding is niet beschikbaar.');
    return data;
}

function mobilePanel() {
    return `<div class="mt-4 rounded-xl border border-yellow-400/50 bg-slate-950 p-4 text-left">
        <p class="font-black text-yellow-300">Tick Tack Kaboom mobiele app</p>
        ${mobileRoom
            ? `<p class="mt-2 text-sm text-slate-200">Vul deze tv-code in de app in:</p>
               <p class="my-2 font-mono text-4xl font-black tracking-widest text-white">${mobileRoom.code}</p>
               <p class="text-sm text-slate-300">Houd dit tv-scherm open. Maximaal 50 telefoons.</p>
               <button onclick="stopMobileCompanion()" class="mt-3 min-h-[48px] rounded-lg bg-slate-700 px-4 font-bold text-white">Stop mobiele sessie</button>`
            : `<p class="mt-1 text-sm text-slate-200">Speel met de native app op iPhone of Android, naast de bestaande webbuzzer.</p>
               <button onclick="startMobileCompanion()" ${mobileStarting ? 'disabled' : ''} class="mt-3 min-h-[48px] rounded-lg bg-indigo-600 px-4 font-black text-white">${mobileStarting ? 'Verbinden…' : 'Maak mobiele tv-code'}</button>`}
        ${mobileError ? `<p role="alert" class="mt-2 text-red-300">${escapeBuzzerText(mobileError)}</p>` : ''}
    </div>`;
}

const originalBuzzerSetupPanel = renderPhoneBuzzerSetupPanel;
renderPhoneBuzzerSetupPanel = function () { return originalBuzzerSetupPanel() + mobilePanel(); };
const originalBuzzerPlayStatus = renderPhoneBuzzerPlayStatus;
renderPhoneBuzzerPlayStatus = function () {
    const html = originalBuzzerPlayStatus().replace('Telefoonbuzzer staat uit', 'Webbuzzer staat uit');
    const extra = `<span class="ml-2 text-yellow-300">${mobileRoom ? 'App-code: ' + mobileRoom.code : ''}</span>
        <button onclick="${mobileRoom ? 'showMobileCode()' : 'startMobileCompanion()'}" class="ml-2 min-h-[48px] rounded-lg bg-slate-700 px-3 text-sm font-bold text-white">${mobileRoom ? 'App-code' : 'Koppel app'}</button>
        ${mobileRoom ? '<button onclick="stopMobileCompanion()" class="ml-2 min-h-[48px] rounded-lg bg-red-900 px-3 text-sm font-bold text-white">Stop app-sessie</button>' : ''}`;
    return html.replace('</div>', extra + '</div>');
};
function showMobileCode() {
    window.alert(mobileRoom ? `Vul ${mobileRoom.code} in de Tick Tack Kaboom-app in.` : 'Maak eerst een mobiele tv-code.');
}

async function startMobileCompanion() {
    if (mobileRoom || mobileStarting) return;
    mobileStarting = true;
    mobileError = '';
    refreshPhoneBuzzerPanels();
    try {
        mobileRoom = await mobileRequest('sessions', {});
        mobileAck = 0;
        mobileTimer = setInterval(exchangeMobileCompanion, 350);
        await exchangeMobileCompanion();
    } catch (error) { mobileError = error.message; }
    finally { mobileStarting = false; refreshPhoneBuzzerPanels(); }
}

async function stopMobileCompanion() {
    clearInterval(mobileTimer);
    const room = mobileRoom;
    mobileRoom = null;
    for (const key of buzzerConnections.keys()) if (key.startsWith('mobile:')) buzzerConnections.delete(key);
    if (firstBuzzer?.peer.startsWith('mobile:')) firstBuzzer = null;
    if (room) {
        try { await mobileRequest('host', { ...room, ack: mobileAck, states: [], close: true }); }
        catch { /* The local host is stopped even if the network is unavailable; server TTL expires it. */ }
    }
    mobileError = '';
    refreshPhoneBuzzerPanels();
    render();
}

async function exchangeMobileCompanion() {
    if (!mobileRoom || mobileBusy) return;
    mobileBusy = true;
    const room = mobileRoom;
    const roundId = mobileRoundId();
    try {
        const states = [];
        buzzerConnections.forEach((entry, key) => {
            if (!key.startsWith('mobile:')) return;
            const isWinner = firstBuzzer?.peer === key;
            const canAnswer = Boolean(isWinner && !firstBuzzer.answered && !isQuestionAnswered && gameState.screen === 'play');
            const player = gameState.players.find(p => p.companionProfileId === entry.companionProfileId);
            states.push({ playerId: key.slice(7), state: {
                connected: true, canBuzz: gameState.screen === 'play' && !firstBuzzer && !isQuestionAnswered,
                canAnswer, question: canAnswer ? gameState.huidigeOpdracht.tekst : '',
                options: canAnswer ? gameState.huidigeOpdracht.opties.filter(answer => !(gameState.hiddenAnswers || []).includes(answer)) : [],
                points: Math.max(0, Math.floor(Number(player?.punten) || 0)), roundId,
                status: gameState.screen !== 'play' || isQuestionAnswered ? 'Vraag afgelopen. Wacht op de tv.'
                    : firstBuzzer ? `${firstBuzzer.naam} was als eerste.`
                    : gameState.screen === 'play' && !isQuestionAnswered ? 'De vraag staat klaar. Druk op BUZZ!' : 'Wacht tot de volgende vraag.'
            }});
        });
        const result = await mobileRequest('host', { ...room, ack: mobileAck, states });
        if (mobileRoom !== room) return;
        const active = new Set(result.players.map(p => 'mobile:' + p.playerId));
        for (const key of buzzerConnections.keys()) {
            if (key.startsWith('mobile:') && !active.has(key)) {
                buzzerConnections.delete(key);
                if (firstBuzzer?.peer === key) firstBuzzer = null;
            }
        }
        for (const player of result.players) {
            const key = 'mobile:' + player.playerId;
            if (!buzzerConnections.has(key)) {
                const previous = gameState.players.find(p => p.companionProfileId === player.profileId);
                const desired = sanitizeBuzzerName(previous?.naam || player.name) || 'Speler';
                const occupied = new Set([...buzzerConnections.values()].map(entry => entry.name.toLowerCase()));
                let name = desired;
                for (let suffix = 2; occupied.has(name.toLowerCase()); suffix++) {
                    const ending = ` (${suffix})`;
                    name = desired.slice(0, 24 - ending.length) + ending;
                }
                const index = findOrCreateBuzzerPlayer(name, player.profileId);
                gameState.players[index].naam = name;
                buzzerConnections.set(key, {
                    name, companionProfileId: player.profileId,
                    connection: { peer: key, open: true, send() {} }
                });
                refreshPhoneBuzzerPanels();
                if (gameState.screen === 'start') render();
            }
        }
        for (const event of result.events) {
            if (event.id <= mobileAck) continue;
            const entry = buzzerConnections.get('mobile:' + event.playerId);
            if (entry && event.roundId === mobileRoundId() && !isQuestionAnswered) {
                handlePhoneBuzzerHostData(event.action === 'buzz'
                    ? { type: 'BUZZ', roundId: event.roundId }
                    : { type: 'BUZZER_ANSWER', antwoord: event.answer, roundId: event.roundId }, entry.connection);
            }
            mobileAck = event.id;
        }
        if (mobileError) { mobileError = ''; refreshPhoneBuzzerPanels(); }
    } catch (error) {
        mobileError = error.message;
        refreshPhoneBuzzerPanels();
    } finally { mobileBusy = false; }
}

</script>
